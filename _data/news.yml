    **Mathematical Physics Open Problems Is Now Live!**

    I’m happy to announce the launch of [Mathematical Physics Open Problems](https://yuytkuy-eng.github.io/open-problems/), a collection of 553 problems with mathematical formulations, original sources, and links to research progress. Alongside this project, I plan to begin work on the axiomatization of physics.

