<div class="academic-footer">
  <a class="footer-sitemap" href="{{ '/sitemap/' | relative_url }}">Sitemap</a>
  {% unless site.atom_feed.hide %}
  <div class="footer-follow">
    <span>Follow:</span>
    <a href="{{ site.atom_feed.path | default: '/feed.xml' | relative_url }}" rel="alternate" type="application/atom+xml"><i class="fa-solid fa-square-rss" aria-hidden="true"></i><span>Feed</span></a>
  </div>
  {% endunless %}
  <p class="footer-credits">&copy; {{ site.time | date: '%Y' }} {{ site.name | escape }}, Powered by <a href="https://jekyllrb.com/">Jekyll</a> &amp; <a href="https://github.com/academicpages/academicpages.github.io">AcademicPages</a>, a fork of <a href="https://mademistakes.com/work/minimal-mistakes-jekyll-theme/">Minimal Mistakes</a>.</p>
  <p>Site last updated <time datetime="{{ site.time | date: '%Y-%m-%d' }}">{{ site.time | date: '%Y-%m-%d' }}</time></p>
  <p class="footer-counter" data-site-url="{{ site.url | escape }}" title="Page views are currently unavailable."><i class="fa-regular fa-eye" aria-hidden="true"></i> Total page views: <span id="busuanzi_value_site_pv" aria-live="polite">—</span></p>
</div>
